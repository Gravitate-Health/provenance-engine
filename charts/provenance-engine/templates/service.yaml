apiVersion: v1
kind: Service
metadata:
  name: {{ include "provenance-engine.fullname" . }}
  labels:
    {{- include "provenance-engine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "provenance-engine.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
